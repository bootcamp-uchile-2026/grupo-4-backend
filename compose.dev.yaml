services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-lasobremesa}
      MYSQL_USER: ${DB_USER:-lasobremesa}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3308}:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      target: builder
    restart: unless-stopped
    working_dir: /app
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-lasobremesa}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      DB_NAME: ${DB_NAME:-lasobremesa}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3000}:3000"
    volumes:
      - ./src:/app/src
      - ./db:/app/db
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c "npx typeorm-ts-node-commonjs migration:run -d db/typeorm.config.ts && npm run start:dev"

volumes:
  mysql_dev_data:
